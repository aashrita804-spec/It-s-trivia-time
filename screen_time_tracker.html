<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screen Time Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1); --text: #1a1a18; --text2: #6b6a65; --text3: #a09f9a;
    --radius-md: 8px; --radius-lg: 12px;
    --social: #7F77DD; --work: #1D9E75; --entertainment: #D85A30;
    --health: #639922; --news: #378ADD; --games: #D4537E; --other: #888780;
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 1.5rem; }
  .section-title { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
  .add-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr 80px auto; gap: 8px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text2); }
  .field input, .field select {
    width: 100%; height: 36px; border: 0.5px solid var(--border); border-radius: var(--radius-md);
    padding: 0 10px; font-size: 14px; background: var(--surface); color: var(--text); outline: none;
  }
  .field input:focus, .field select:focus { border-color: rgba(0,0,0,0.3); }
  .add-btn {
    height: 36px; background: var(--text); color: var(--surface); border: none;
    border-radius: var(--radius-md); font-size: 14px; cursor: pointer; font-weight: 500; padding: 0 14px;
  }
  .add-btn:hover { opacity: 0.85; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .metric { background: var(--surface2); border-radius: var(--radius-md); padding: 14px; }
  .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .chart-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .chart-wrap { position: relative; width: 100%; height: 220px; }
  .filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .day-tabs { display: flex; gap: 6px; }
  .day-tab {
    font-size: 13px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid var(--border); background: none; cursor: pointer; color: var(--text2);
  }
  .day-tab.active { background: var(--text); color: var(--surface); border-color: transparent; }
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 1.25rem; display: flex; align-items: center; gap: 12px; }
  .app-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .log-info { flex: 1; }
  .log-app { font-size: 15px; font-weight: 500; }
  .log-cat { font-size: 12px; color: var(--text2); }
  .log-right { display: flex; align-items: center; gap: 12px; }
  .log-time { font-size: 16px; font-weight: 500; }
  .log-date { font-size: 12px; color: var(--text3); min-width: 50px; text-align: right; }
  .log-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; padding: 4px; border-radius: var(--radius-md); line-height: 1; }
  .log-del:hover { color: #e24b4a; background: #fcebeb; }
  .empty { text-align: center; color: var(--text3); font-size: 14px; padding: 2.5rem 0; }
  @media (max-width: 500px) { .form-row { grid-template-columns: 1fr 1fr; } .form-row .add-btn { grid-column: span 2; } }
</style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-device-mobile" style="vertical-align:-2px; margin-right:8px;" aria-hidden="true"></i>Screen Time</h1>

  <p class="section-title">Add entry</p>
  <div class="add-card">
    <div class="form-row">
      <div class="field">
        <label for="appName">App / Website</label>
        <input type="text" id="appName" placeholder="e.g. Instagram" />
      </div>
      <div class="field">
        <label for="catSel">Category</label>
        <select id="catSel">
          <option>Social</option><option>Work</option><option>Entertainment</option>
          <option>Health</option><option>News</option><option>Games</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="mins">Minutes</label>
        <input type="number" id="mins" placeholder="30" min="1" max="1440" />
      </div>
      <button class="add-btn" onclick="addEntry()">+ Add</button>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="metric-label">Today's total</div><div class="metric-value" id="m-today">0m</div><div class="metric-sub">screen time</div></div>
    <div class="metric"><div class="metric-label">Top app today</div><div class="metric-value" id="m-top" style="font-size:15px;padding-top:4px;">—</div><div class="metric-sub" id="m-top-sub"></div></div>
    <div class="metric"><div class="metric-label">Entries logged</div><div class="metric-value" id="m-count">0</div><div class="metric-sub">all time</div></div>
  </div>

  <p class="section-title">By category — today</p>
  <div class="chart-card">
    <div class="chart-wrap" id="chartWrap"><canvas id="catChart" role="img" aria-label="Screen time by category today">No data yet.</canvas></div>
  </div>

  <div class="filter-row">
    <p class="section-title" style="margin-bottom:0;">Recent entries</p>
    <div class="day-tabs">
      <button class="day-tab active" onclick="setFilter('today',this)">Today</button>
      <button class="day-tab" onclick="setFilter('week',this)">This week</button>
      <button class="day-tab" onclick="setFilter('all',this)">All</button>
    </div>
  </div>
  <div class="log-list" id="logList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CAT_COLORS = { Social:'#7F77DD', Work:'#1D9E75', Entertainment:'#D85A30', Health:'#639922', News:'#378ADD', Games:'#D4537E', Other:'#888780' };
let entries = JSON.parse(localStorage.getItem('st_entries') || '[]');
let filter = 'today';
let catChart = null;

function save() { localStorage.setItem('st_entries', JSON.stringify(entries)); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtMin(m) { if (m < 60) return m + 'm'; return Math.floor(m/60) + 'h ' + (m%60) + 'm'; }

function addEntry() {
  const name = document.getElementById('appName').value.trim();
  const cat = document.getElementById('catSel').value;
  const mins = parseInt(document.getElementById('mins').value);
  if (!name || !mins || mins < 1) return;
  entries.unshift({ id: Date.now(), name, cat, mins, date: todayStr() });
  save(); render();
  document.getElementById('appName').value = '';
  document.getElementById('mins').value = '';
}

function deleteEntry(id) { entries = entries.filter(e => e.id !== id); save(); render(); }
function setFilter(f, btn) { filter = f; document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }

function filteredEntries() {
  const today = todayStr();
  if (filter === 'today') return entries.filter(e => e.date === today);
  if (filter === 'week') { const d = new Date(); d.setDate(d.getDate()-6); return entries.filter(e => e.date >= d.toISOString().slice(0,10)); }
  return entries;
}

function render() {
  const today = todayStr();
  const todayEnt = entries.filter(e => e.date === today);
  const totalToday = todayEnt.reduce((s,e) => s + e.mins, 0);
  document.getElementById('m-today').textContent = fmtMin(totalToday);
  document.getElementById('m-count').textContent = entries.length;
  const topMap = {};
  todayEnt.forEach(e => { topMap[e.name] = (topMap[e.name]||0) + e.mins; });
  const topApp = Object.entries(topMap).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('m-top').textContent = topApp ? topApp[0] : '—';
  document.getElementById('m-top-sub').textContent = topApp ? fmtMin(topApp[1]) : '';

  const catMap = {};
  todayEnt.forEach(e => { catMap[e.cat] = (catMap[e.cat]||0) + e.mins; });
  const cats = Object.keys(catMap);
  const vals = cats.map(c => catMap[c]);

  if (catChart) { catChart.destroy(); catChart = null; }
  const wrap = document.getElementById('chartWrap');
  if (cats.length === 0) {
    wrap.innerHTML = '<div class="empty"><i class="ti ti-device-mobile-off" style="font-size:28px;display:block;margin-bottom:8px;"></i>No entries for today yet</div>';
  } else {
    wrap.innerHTML = '<canvas id="catChart" role="img" aria-label="Screen time by category today"></canvas>';
    catChart = new Chart(document.getElementById('catChart').getContext('2d'), {
      type: 'bar',
      data: { labels: cats, datasets: [{ data: vals, backgroundColor: cats.map(c => CAT_COLORS[c]||'#888'), borderRadius: 6, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid:{display:false}, ticks:{color:'#888',font:{size:12}} }, y: { grid:{color:'rgba(128,128,128,0.1)'}, ticks:{color:'#888',font:{size:12},callback:v=>fmtMin(v)} } } }
    });
  }

  const list = document.getElementById('logList');
  const shown = filteredEntries();
  if (shown.length === 0) { list.innerHTML = '<div class="empty">No entries for this period</div>'; return; }
  list.innerHTML = shown.map(e => `
    <div class="log-item">
      <div class="app-dot" style="background:${CAT_COLORS[e.cat]||'#888'};"></div>
      <div class="log-info"><div class="log-app">${e.name}</div><div class="log-cat">${e.cat}</div></div>
      <div class="log-right">
        <div class="log-time">${fmtMin(e.mins)}</div>
        <div class="log-date">${e.date === todayStr() ? 'Today' : e.date.slice(5)}</div>
        <button class="log-del" onclick="deleteEntry(${e.id})" aria-label="Delete entry"><i class="ti ti-x"></i></button>
      </div>
    </div>`).join('');
}
render();
</script>
</body>
</html>
